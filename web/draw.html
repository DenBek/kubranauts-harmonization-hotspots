<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fire Calendar · Draw an area</title>
  <!-- Drawing an area now happens on the home map (index.html?mode=draw). Old links keep ?rect= and the hash. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      q.set("mode", "draw");
      location.replace("index.html?" + q.toString() + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=index.html?mode=draw">
</head>
<body>
  <p>Drawing an area is on the <a href="index.html?mode=draw">map</a>.</p>
</body>
</html>
